<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Expense Distributor</title>
    <style>
        * { box-sizing: border-box; font-family: sans-serif; }
        body { background: #f4f6f8; padding: 20px; }
        .container { max-width: 850px; margin: 0 auto; }
        .card { background: #fff; padding: 16px; border-radius: 6px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
        .header { display: flex; justify-content: space-between; align-items: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { text-align: left; padding: 8px; border-bottom: 1px solid #eee; vertical-align: top; }
        .pos { color: green; font-weight: bold; }
        .neg { color: red; font-weight: bold; }
        .inline-form { display: flex; gap: 10px; align-items: center; }
        input, select, button { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #007bff; color: white; border: none; cursor: pointer; }
        
        /* Badges & Split List Styling */
        .badge { padding: 3px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .badge-success { background: #d4edda; color: #155724; }
        .badge-danger { background: #f8d7da; color: #721c24; }
        .btn-sm { padding: 3px 8px; font-size: 11px; }
        .btn-clear { background: #dc3545; color: white; }
        .btn-toggle { background: #17a2b8; color: white; }
        
        .share-list { list-style: none; padding: 0; margin: 0; }
        .share-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 0; border-bottom: 1px dashed #f0f0f0; }
    </style>
</head>
<body>
<div class="container">
    <div class="header card">
        <h2>EXPENSE DISTRIBUTOR</h2>
        <a href="/logout"><button style="background:#dc3545;">Logout</button></a>
    </div>

    <!-- Group Selection & Creation -->
    <div class="card inline-form">
        <form action="/" method="get" style="display:flex; gap:10px; flex:1;">
            <label><strong>Group:</strong></label>
            <select name="groupId" onchange="this.form.submit()">
                <option th:each="g : ${groups}" th:value="${g.id}" th:text="${g.name}" th:selected="${currentGroup != null and g.id == currentGroup.id}"></option>
            </select>
        </form>
        <form action="/groups/create" method="post" style="display:flex; gap:5px;">
            <input type="text" name="name" placeholder="New Group Name" required>
            <button type="submit" style="background:#6c757d;">+ Group</button>
        </form>
    </div>

    <div th:if="${currentGroup}">
        <!-- Member Addition -->
        <div class="card">
            <h3>Add Member</h3>
            <form action="/members/add" method="post" class="inline-form">
                <input type="hidden" name="groupId" th:value="${currentGroup.id}">
                <input type="text" name="name" placeholder="Member Name" required>
                <button type="submit">+ Add Member</button>
            </form>
        </div>

        <!-- Members Table -->
        <div class="card">
            <h3>Members & Balances</h3>
            <table>
                <thead>
                    <tr><th>Member</th><th>Total Paid</th><th>Net Status</th></tr>
                </thead>
                <tbody>
                    <tr th:each="m : ${memberStats}">
                        <th:block th:with="bal=${m.balance}">
                            <td th:text="${m.name}"></td>
                            <td th:text="'₹' + ${#numbers.formatDecimal(m.paid, 1, 2)}"></td>
                            <td th:class="${bal >= 0 ? 'pos' : 'neg'}">
                                <span th:if="${bal > 0}" th:text="'Gets back ₹' + ${#numbers.formatDecimal(bal, 1, 2)}"></span>
                                <span th:if="${bal < 0}" th:text="'Owes ₹' + ${#numbers.formatDecimal(-bal, 1, 2)}"></span>
                                <span th:if="${bal == 0}">Settled up</span>
                            </td>
                        </th:block>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Add Expense -->
        <div class="card" th:if="${!currentGroup.members.isEmpty()}">
            <h3>Add Expense</h3>
            <form action="/expenses/add" method="post" style="display:grid; gap:10px; grid-template-columns: 1fr 1fr;">
                <input type="hidden" name="groupId" th:value="${currentGroup.id}">
                <input type="text" name="description" placeholder="Description (e.g. Dinner)" required>
                <input type="number" step="0.01" name="amount" placeholder="Amount (₹)" required>
                <select name="paidByMemberId" required>
                    <option value="" disabled selected>Who Paid?</option>
                    <option th:each="m : ${currentGroup.members}" th:value="${m.id}" th:text="${m.name}"></option>
                </select>
                <input type="date" name="date" required>
                <button type="submit" style="grid-column: span 2;">Save Expense</button>
            </form>
        </div>

        <!-- Expense History & Breakdown -->
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3>Expense History & Member Shares</h3>
                <form action="/expenses/clear" method="post" style="margin: 0;">
                    <input type="hidden" name="groupId" th:value="${currentGroup.id}">
                    <button type="submit" class="btn-clear btn-sm" onclick="return confirm('Clear all expenses?');">Clear History</button>
                </form>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Expense</th>
                        <th>Amount</th>
                        <th>Paid By</th>
                        <th>Individual Breakdown (Who Owes What)</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="e : ${currentGroup.expenses}">
                        <td>
                            <strong th:text="${e.description}"></strong><br>
                            <small color="#888" th:text="${e.date}"></small>
                        </td>
                        <td th:text="'₹' + ${e.amount}"></td>
                        <td th:text="${memberNameMap.get(e.paidByMemberId)}"></td>
                        <td>
                            <ul class="share-list">
                                <li th:each="share : ${e.shares}" class="share-item">
                                    <span>
                                        <strong th:text="${memberNameMap.get(share.owerMemberId)}"></strong> owes 
                                        <span th:text="'₹' + ${share.shareAmount}"></span>
                                    </span>
                                    
                                    <div style="display:flex; gap:5px; align-items:center;">
                                        <span th:if="${share.paid}" class="badge badge-success">Paid</span>
                                        <span th:unless="${share.paid}" class="badge badge-danger">Unpaid</span>
                                        
                                        <form action="/shares/toggle-paid" method="post" style="margin:0;">
                                            <input type="hidden" name="shareId" th:value="${share.id}">
                                            <input type="hidden" name="groupId" th:value="${currentGroup.id}">
                                            <button type="submit" class="btn-toggle btn-sm" 
                                                    th:text="${share.paid} ? 'Mark Unpaid' : 'Mark Paid'">
                                            </button>
                                        </form>
                                    </div>
                                </li>
                            </ul>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
