<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Expense Splitter Dashboard</title>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Theme Color Palette */
            --primary-blue: #0284c7;
            --primary-blue-hover: #0369a1;
            --accent-sky: #38bdf8;
            --text-main: #0f172a;
            --text-muted: #475569;
            
            /* Light Glass Boxes over Dark Backdrop */
            --glass-bg: rgba(255, 255, 255, 0.12);
            --glass-card: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(255, 255, 255, 0.85);
            
            /* High-Contrast Shadows */
            --glass-shadow: 
                0 20px 40px -15px rgba(0, 0, 0, 0.5),
                inset 0 1px 1px 0 rgba(255, 255, 255, 0.4);
            --card-shadow: 
                0 10px 25px -5px rgba(0, 0, 0, 0.2),
                inset 0 1px 2px 0 rgba(255, 255, 255, 0.9);
        }

        /* Dark Mesh Gradient Background */
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #0b1329;
            background-image: 
                radial-gradient(at 0% 0%, rgba(14, 165, 233, 0.25) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(3, 105, 161, 0.3) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(15, 23, 42, 0.8) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(56, 189, 248, 0.15) 0px, transparent 50%);
            background-attachment: fixed;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            color: #f8fafc;
            -webkit-font-smoothing: antialiased;
        }

        /* Main Dashboard Container (Translucent Outer Wrapper) */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            padding: 32px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: var(--glass-shadow);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            padding-bottom: 18px;
            margin-bottom: 28px;
        }
        .header h1 { 
            margin: 0; 
            font-size: 24px; 
            color: #ffffff; 
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .user-meta {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 14px;
            color: #cbd5e1;
        }

        .logout-btn {
            background: rgba(239, 68, 68, 0.85);
            backdrop-filter: blur(4px);
            color: white;
            padding: 8px 16px;
            text-decoration: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.25);
        }
        .logout-btn:hover {
            background: rgba(220, 38, 38, 0.95);
            transform: translateY(-1px);
        }
        .logout-btn:active { transform: scale(0.98); }

        .group-selector {
            margin-bottom: 28px;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        /* Inputs & Selects inside Light Glass Cards */
        select, input[type="text"], input[type="number"], input[type="date"] {
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(203, 213, 225, 0.8);
            border-radius: 10px;
            font-family: inherit;
            font-size: 13.5px;
            color: var(--text-main);
            outline: none;
            backdrop-filter: blur(6px);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        select:focus, input:focus {
            background: #ffffff;
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 3.5px rgba(2, 132, 199, 0.2);
        }

        /* Buttons */
        .btn {
            background: var(--primary-blue);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 10px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-family: inherit;
            font-size: 13.5px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 14px rgba(2, 132, 199, 0.3);
        }
        .btn:hover { 
            background: var(--primary-blue-hover); 
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(2, 132, 199, 0.4);
        }
        .btn:active { transform: scale(0.98); }

        .btn-success { 
            background: #10b981; 
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
        }
        .btn-success:hover { 
            background: #059669; 
            box-shadow: 0 6px 18px rgba(16, 185, 129, 0.4);
        }
        .btn-danger { 
            background: #ef4444; 
            box-shadow: 0 4px 14px rgba(239, 68, 68, 0.3);
        }
        .btn-danger:hover { background: #dc2626; }

        /* Light Glass Boxes / Cards */
        .card {
            background: var(--glass-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            padding: 22px;
            margin-bottom: 24px;
            box-shadow: var(--card-shadow);
            color: var(--text-main);
        }
        .card h3 { 
            margin-top: 0; 
            color: #0369a1; 
            font-size: 16px; 
            font-weight: 700; 
            letter-spacing: -0.01em; 
        }

        /* Premium Banner Box */
        .premium-card {
            background: linear-gradient(135deg, rgba(14, 165, 233, 0.9) 0%, rgba(3, 105, 161, 0.95) 100%);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            color: white;
            border-radius: 18px;
            padding: 24px 28px;
            margin-bottom: 28px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.3), inset 0 1px 2px rgba(255, 255, 255, 0.6);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .premium-title {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0 0 10px 0;
            font-size: 18px;
            font-weight: 700;
        }
        .premium-info ul { margin: 8px 0 0 0; padding-left: 20px; font-size: 13.5px; line-height: 1.6; color: #f0f9ff; }

            background: #ffffff;
            color
